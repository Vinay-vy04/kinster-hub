name: Daily Telegram Reminder

on:
  schedule:
    # Runs at 2:30 AM UTC daily, which is 8:00 AM IST
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"🌅 Good morning! It is time to check Kinster Hub for today's high-impact tasks. Don't forget to review the pulse score!\"}"
